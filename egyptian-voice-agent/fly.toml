# Fly.io app config. Run `fly launch --no-deploy` first to register the app name,
# then `fly secrets import < .env && fly deploy`.
#
# Frankfurt ("fra") minimizes RTT to Egypt for Twilio Media Streams audio.

app = "egyptian-voice-agent"
primary_region = "fra"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep warm — cold start ruins first-turn latency
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[mounts]
  source = "voice_agent_data"
  destination = "/app/data"
