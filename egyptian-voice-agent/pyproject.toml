[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egyptian-voice-agent"
version = "0.1.0"
description = "Egyptian Arabic AI voice agent for phone-based sales lead qualification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "pipecat-ai[anthropic,deepgram,azure,silero,twilio]>=0.0.47",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "gspread>=6.0.0",
    "google-auth>=2.29.0",
    "rich>=13.7.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "jiwer>=3.0.0",
]
elevenlabs = [
    "pipecat-ai[elevenlabs]",
]

[project.scripts]
egyptian-voice-agent = "egyptian_voice_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/egyptian_voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
